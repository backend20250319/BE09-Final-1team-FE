name: Deploy Frontend to AWS Elastic Beanstalk

on:
  push:
    branches: [feature/junseo]

env:
  AWS_REGION: ap-northeast-2
  ECR_REPOSITORY: my-front
  EB_APPLICATION_NAME: my-front-eb
  # 🚨 [수정 완료] 실제 환경 이름과 대소문자를 정확히 일치시켰습니다.
  EB_ENVIRONMENT_NAME: My-front-eb-env

jobs:
  build-and-deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        id: aws-creds
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::783648732440:role/github-actions-oidc-front
          aws-region: ${{ env.AWS_REGION }}

      - name: WhoAmI
        run: |
          aws sts get-caller-identity

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push image to Amazon ECR
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

      - name: Generate Dockerrun.aws.json
        run: |
          echo '{
            "AWSEBDockerunVersion": "1",
            "Image": {
              "Name": "${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}",
              "Update": "true"
            },
            "Ports": [
              {
                "ContainerPort": 3000,
                "HostPort": 80
              }
            ],
            "Environment": [
              {
                "Name": "NODE_ENV",
                "Value": "production"
              }
            ]
          }' > Dockerrun.aws.json

      - name: Create deployment package
        run: zip deploy.zip Dockerrun.aws.json

      # --- 🚀 DEPLOYMENT STEP REVISED ---
      - name: Verify EB Environment and Deploy using AWS CLI
        run: |
          # 1. Check if the environment exists before trying to deploy
          aws elasticbeanstalk describe-environments \
            --application-name ${{ env.EB_APPLICATION_NAME }} \
            --environment-names ${{ env.EB_ENVIRONMENT_NAME }} \
            --region ${{ env.AWS_REGION }}
          
          # 2. Create a new application version with the zipped package
          aws elasticbeanstalk create-application-version \
            --application-name ${{ env.EB_APPLICATION_NAME }} \
            --version-label ${{ github.sha }} \
            --source-bundle fileb://deploy.zip \
            --region ${{ env.AWS_REGION }}

          # 3. Update the environment to use the new version
          aws elasticbeanstalk update-environment \
            --application-name ${{ env.EB_APPLICATION_NAME }} \
            --environment-name ${{ env.EB_ENVIRONMENT_NAME }} \
            --version-label ${{ github.sha }} \
            --region ${{ env.AWS_REGION }}

