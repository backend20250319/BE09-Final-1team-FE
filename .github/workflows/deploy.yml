name: Deploy Frontend to AWS Elastic Beanstalk

on:
  push:
    branches: [feature/junseo]

env:
  AWS_REGION: ap-northeast-2
  ECR_REPOSITORY: my-front
  EB_APPLICATION_NAME: my-front-eb
  EB_ENVIRONMENT_NAME: My-front-eb-env

jobs:
  build-and-deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        id: aws-creds # This step gets temporary credentials from AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::783648732440:role/github-actions-oidc-front
          aws-region: ${{ env.AWS_REGION }}

      - name: WhoAmI # This step confirms the credentials were received
        run: |
          aws sts get-caller-identity

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push image to Amazon ECR
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

      - name: Generate Dockerrun.aws.json
        run: |
          echo '{
            "AWSEBDockerrunVersion": "1",
            "Image": {
              "Name": "${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}",
              "Update": "true"
            },
            "Ports": [
              {
                "ContainerPort": 3000,
                "HostPort": 80
              }
            ],
            "Environment": [
              {
                "Name": "NODE_ENV",
                "Value": "production"
              }
            ]
          }' > Dockerrun.aws.json

      - name: Create deployment package
        run: zip deploy.zip Dockerrun.aws.json

      - name: Deploy to Elastic Beanstalk
        uses: einaregilsson/beanstalk-deploy@v21
        with:
          application_name: ${{ env.EB_APPLICATION_NAME }}
          environment_name: ${{ env.EB_ENVIRONMENT_NAME }}
          version_label: ${{ github.sha }}
          region: ${{ env.AWS_REGION }}
          deployment_package: deploy.zip
          # 🔑 Pass credentials directly to the action via 'with' parameters.
          # This is the most explicit method and solves the "not specified" error.
          aws_access_key: ${{ steps.aws-creds.outputs.aws-access-key-id }}
          aws_secret_key: ${{ steps.aws-creds.outputs.aws-secret-key }}
          aws_session_token: ${{ steps.aws-creds.outputs.aws-session-token }}

