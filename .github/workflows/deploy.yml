name: Deploy Frontend to AWS Elastic Beanstalk

on:
  push:
    branches: [feature/junseo]

env:
  AWS_REGION: ap-northeast-2
  ECR_REPOSITORY: my-front
  EB_APPLICATION_NAME: my-front-eb
  EB_ENVIRONMENT_NAME: My-front-eb-env
  # 🚨 [추가] 배포 패키지를 저장할 S3 경로 설정
  S3_BUCKET_NAME: elasticbeanstalk-${{ env.AWS_REGION }}-${{ secrets.AWS_ACCOUNT_ID }} # 계정 ID Secret 필요
  S3_KEY: ${{ env.EB_APPLICATION_NAME }}/${{ github.sha }}.zip

jobs:
  build-and-deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        id: aws-creds
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::783648732440:role/github-actions-oidc-front
          # 🚨 [추가] AWS 계정 ID를 secrets에서 가져옵니다.
          aws-account-id: ${{ secrets.AWS_ACCOUNT_ID }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push image to Amazon ECR
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

      - name: Generate Dockerrun.aws.json
        run: |
          echo '{
            "AWSEBDockerrunVersion": "1",
            "Image": {
              "Name": "${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}",
              "Update": "true"
            },
            "Ports": [
              {
                "ContainerPort": 3000
              }
            ]
          }' > Dockerrun.aws.json

      - name: Create deployment package
        run: zip deploy.zip Dockerrun.aws.json

      # 🚨 [최종 수정] 문제가 있는 외부 액션을 제거하고, AWS 공식 CLI를 직접 사용합니다.
      - name: Deploy to Elastic Beanstalk using AWS CLI
        run: |
          S3_BUCKET="elasticbeanstalk-${{ env.AWS_REGION }}-${{ steps.aws-creds.outputs.aws-account-id }}"
          S3_KEY="${{ env.EB_APPLICATION_NAME }}/deploy-${{ github.sha }}.zip"
          VERSION_LABEL="v-${{ github.sha }}"

          echo "Uploading to s3://$S3_BUCKET/$S3_KEY"
          aws s3 cp deploy.zip "s3://$S3_BUCKET/$S3_KEY"

          echo "Creating new application version $VERSION_LABEL"
          aws elasticbeanstalk create-application-version \
            --application-name "${{ env.EB_APPLICATION_NAME }}" \
            --version-label "$VERSION_LABEL" \
            --source-bundle S3Bucket="$S3_BUCKET",S3Key="$S3_KEY" \
            --description "Commit ${{ github.sha }}"

          echo "Updating environment ${{ env.EB_ENVIRONMENT_NAME }} with version $VERSION_LABEL"
          aws elasticbeanstalk update-environment \
            --environment-name "${{ env.EB_ENVIRONMENT_NAME }}" \
            --version-label "$VERSION_LABEL"

