name: Deploy Frontend to AWS Elastic Beanstalk

on:
  push:
    branches: [feature/junseo]

env:
  AWS_REGION: ap-northeast-2
  ECR_REPOSITORY: my-front
  EB_APPLICATION_NAME: my-front-eb
  EB_ENVIRONMENT_NAME: My-front-eb-env

jobs:
  build-and-deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 🚨 [핵심] OIDC로 임시 자격 증명을 발급받고, id를 부여하여 이후 단계에서 참조할 수 있게 합니다.
      - name: Configure AWS credentials
        id: aws-creds # id 부여
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::783648732440:role/github-actions-oidc-front
          aws-region: ${{ env.AWS_REGION }}

      - name: WhoAmI
        run: |
          aws sts get-caller-identity

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push image to Amazon ECR
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

      # 🚨 [수정] 이전 성공 방식과 유사하게 Dockerrun.aws.json 구조를 단순화하고 HostPort를 제거합니다.
      - name: Generate Dockerrun.aws.json
        run: |
          echo '{
            "AWSEBDockerrunVersion": "1",
            "Image": {
              "Name": "${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}",
              "Update": "true"
            },
            "Ports": [
              {
                "ContainerPort": 3000
              }
            ]
          }' > Dockerrun.aws.json

      - name: Create deployment package
        run: zip deploy.zip Dockerrun.aws.json

      # 🚨 [최종 수정] 안정적으로 동작했던 'beanstalk-deploy' 액션으로 되돌아갑니다.
      # OIDC로 발급받은 임시 자격 증명을 with 파라미터로 명확하게 전달합니다.
      - name: Deploy to Elastic Beanstalk
        uses: einaregilsson/beanstalk-deploy@v21
        with:
          application_name: ${{ env.EB_APPLICATION_NAME }}
          environment_name: ${{ env.EB_ENVIRONMENT_NAME }}
          version_label: ${{ github.sha }}
          region: ${{ env.AWS_REGION }}
          deployment_package: deploy.zip
          aws_access_key: ${{ steps.aws-creds.outputs.aws-access-key-id }}
          aws_secret_key: ${{ steps.aws-creds.outputs.aws-secret-access-key }}
          aws_session_token: ${{ steps.aws-creds.outputs.aws-session-token }}

